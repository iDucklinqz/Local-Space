[package]
name = "localspace-desktop"
version = "1.1.0"
edition = "2021"
license = "GPL-3.0-only"
build = "build.rs"

[[bin]]
name = "LocalSpace"
path = "src/main.rs"

[dependencies]
wry = { version = "0.57.1", default-features = false, features = ["os-webview"] }
tao = { version = "0.37.2", default-features = false, features = ["rwh_06"] }
tiny_http = "0.12"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
include_dir = "0.7"
rfd = { version = "0.17", default-features = false }
base64 = "0.22"
url = "2"
dunce = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
